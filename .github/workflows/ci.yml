name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Check project structure
        run: |
          echo "Frontend files:"
          ls frontend/src/
          echo "Backend files:"
          ls backend/

      - name: Verify TypeScript files
        working-directory: frontend
        run: |
          echo "TypeScript source files found:"
          find src -name "*.tsx" -o -name "*.ts" | head -20

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Run npm audit
        working-directory: frontend
        run: |
          npm install
          npm audit --audit-level=critical || true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build -t university-mgmt-frontend:${{ github.sha }} ./frontend
      - name: Build auth-service image
        run: docker build -t university-mgmt-auth:${{ github.sha }} ./backend/auth-service