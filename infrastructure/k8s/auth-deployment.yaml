apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: university-mgmt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: your-ecr-registry/auth-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: university-mgmt
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
